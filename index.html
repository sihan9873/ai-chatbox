<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI对话框应用开发</title>
  <link rel="stylesheet" href="./iconfont/iconfont.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/msg.css">

</head>

<body>
  <div class="nav">
    <div class="right">
      <div class="login">

      </div>
      <div class="new">

      </div>
    </div>
    <ul>
      <li>
        <a class="login">
          登录
        </a>
      </li>
      <li>
        <a class="doownload">
          下载
        </a>
      </li>
    </ul>
  </div>

  <div class="main">
    <div class="side">
      <div class="side-content">侧边栏内容</div>
    </div>
    <div class="chat-box">
      <div class="chat-content">
        <div class="message user">用户消息</div>
        <div class="message assistant">AI回复消息</div>

      </div>
      <div class="input-box">
        <textarea id="tx" placeholder="发送消息" rows="10" maxlength="1000"></textarea>
        <i class="iconfont icon-arrow-left-bold send-btn"></i>
      </div>
    </div>
  </div>

  <script src="./side.js"></script>
  <script src="./chat-service.js"></script>
  <script>
    // 等待DOM加载完成
    document.addEventListener('DOMContentLoaded', function () {
      const tx = document.getElementById('tx');
      const chatContent = document.querySelector('.chat-content');

      // 初始化聊天服务
      const chatService = new ChatService();

      // 从本地存储加载历史消息
      const historyMessages = chatService.loadMessages();
      // 渲染历史消息
      historyMessages.forEach(message => {
        chatService.renderMessage(chatContent, message);
      });

      // 创建可复用的发送消息函数
      function sendMessage() {
        const messageText = tx.value.trim();

        if (messageText) {
          // 创建用户消息对象
          const userMessage = chatService.createMessage('user', messageText);

          // 保存并渲染用户消息
          chatService.addMessage(userMessage);
          chatService.renderMessage(chatContent, userMessage);

          // 模拟AI回复（实际应用中应调用API）
          setTimeout(() => {
            const aiMessage = chatService.createMessage('assistant', '这是AI的回复消息。');
            chatService.addMessage(aiMessage);
            chatService.renderMessage(chatContent, aiMessage);
          }, 500);

          // 滚动到底部
          chatContent.scrollTop = chatContent.scrollHeight;
        }

        // 清空文本域
        tx.value = '';
      }

      // 监听文本域的按键事件，实现按下回车发送消息
      tx.addEventListener('keyup', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { // 按下Enter但不按Shift时发送
          e.preventDefault(); // 阻止默认换行行为
          sendMessage(); // 调用可复用的发送消息函数
        }
      });

      // 为发送按钮添加点击事件
      const sendBtn = document.querySelector('.send-btn');
      sendBtn.addEventListener('click', sendMessage); // 调用相同的发送消息函数
    });

  </script>
</body>

</html>
